version: '3'
networks:
    proxy:
        external: true
    backend:
        driver: overlay
services:
    db:
        image: mariadb:11.1.2
        environment:
            MARIADB_ROOT_PASSWORD: admin
            MARIADB_DATABASE: go
            MARIADB_USER: socket
            MARIADB_PASSWORD: socketpw
        networks:
        - backend
    socket:
        image: cjpalmer/go-socket:1.2.0
        networks:
        - backend
    web:
        image: cjpalmer/go-web:1.2.0
        environment:
        - NGINX_HOST=purplebirdman.com
        - NGINX_PORT=80
        networks:
        - backend
        - proxy
